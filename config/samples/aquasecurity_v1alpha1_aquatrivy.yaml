apiVersion: aquasecurity.github.io/v1alpha1
kind: AquaTrivy
metadata:
  name: aqua
  namespace: aqua
spec:
  infra:
    serviceAccount: trivy-operator
    version: "0.34.0"
  config:
    imagePullSecret: trivy-registry
  image:
    registry: docker.io/aquasec
    repository: trivy-operator
    tag: "0.34.0"
    pullPolicy: IfNotPresent
  deploy:
    replicas: 1

